name: Ribbon MTF Signal Scanner

on:
  schedule:
    - cron: "*/15 * * * *"   # 每15分鐘跑一次(GitHub排程實際觸發常會晚個幾分鐘，屬正常現象)
  workflow_dispatch: {}       # 允許在 GitHub 網頁上手動觸發，方便測試

permissions:
  contents: write            # 需要能把 state.json 的變更 commit 回 repo

# 避免兩次執行重疊時，第二個的 git push 因為 remote 已經被第一個推過而被拒絕(fetch first)。
# 這是「掃當下最新狀態」的工作，舊的排隊中執行沒有保留價值，改成cancel-in-progress:true，
# 新的觸發(不管是排程還是手動)直接取消還在排隊/執行中的舊的，避免舊執行卡住佇列讓新的排程一直等。
concurrency:
  group: ribbon-scanner-state
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Commit and push updated state
        run: |
          git config user.name "ribbon-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json subscriptions.json telegram_offset.json

          if git diff --cached --quiet; then
            echo "狀態沒有變化，不用commit"
            exit 0
          fi
          git commit -m "chore: update scan state [skip ci]"

          # push 被拒絕(通常是跟另一次執行的commit撞到)就重抓最新版rebase後重試，最多5次
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push被拒絕，重試第 $i 次..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "rebase失敗，放棄這次的狀態更新(下次執行還是會重新算)"
              git rebase --abort
              exit 0
            fi
            sleep $((RANDOM % 5 + 1))
          done
          echo "重試5次後仍push失敗"
          exit 1
